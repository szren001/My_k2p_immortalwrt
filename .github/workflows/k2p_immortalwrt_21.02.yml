name: Build K2P ImmortalWrt 21.02

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-21.02
  CONFIG_FILE: k2p_21.02.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Setup environment
      run: |
        sudo apt update
        sudo apt install -y build-essential libncurses5-dev libssl-dev zlib1g-dev gawk git ccache gettext \
          libelf-dev xsltproc python3 python3-pip python3-setuptools python3-pyelftools wget file unzip \
          qemu-utils cmake libz-dev rsync libc6-dev-i386 g++-multilib
        sudo timedatectl set-timezone Asia/Shanghai

    - name: Clone source
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        # 去掉不可用的 cnpmjs 镜像，改用官方源
        sed -i 's_https://github.com.cnpmjs.org/openwrt/packages_https://github.com/openwrt/packages_g' feeds.conf.default || true
        sed -i 's_https://github.com.cnpmjs.org/openwrt/luci_https://github.com/openwrt/luci_g' feeds.conf.default || true
        sed -i 's_https://github.com.cnpmjs.org/openwrt/routing_https://github.com/openwrt/routing_g' feeds.conf.default || true

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: Apply custom config
      run: |
        cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Build firmware
      run: |
        cd openwrt
        make defconfig
        make download -j8
        make -j$(nproc) V=s || make -j1 V=s

    - name: Upload firmware
      uses: actions/upload-artifact@main
      with:
        name: K2P-firmware
        path: openwrt/bin/targets/*/*/
